apiVersion: v1
kind: ServiceAccount
metadata:
  name: bug-fixer-webhook-receiver
  labels:
    app.kubernetes.io/name: bug-fixer-agent
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bug-fixer-webhook-receiver
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: bug-fixer-webhook-receiver
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bug-fixer-webhook-receiver
    spec:
      serviceAccountName: bug-fixer-webhook-receiver
      automountServiceAccountToken: false
      containers:
        - name: receiver
          image: REPLACE_WITH_IMAGE_DIGEST
          env:
            - name: WORKER_ENABLED
              value: "false"
            - name: JIRA_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: bug-fixer-webhook
                  key: jira-webhook-secret
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: work
              mountPath: /app/runtime/work
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: work
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: bug-fixer-webhook-receiver
spec:
  selector:
    app.kubernetes.io/name: bug-fixer-webhook-receiver
  ports:
    - port: 80
      targetPort: 8080
